# Read by qmake before every project file in this tree: the app, the core library and the tests.
DEVASS_ROOT = $$PWD
DEVASS_SRC = $$PWD/src
DEVASS_THIRD_PARTY = $$PWD/third_party
# Where the build output goes: the source tree itself, or the matching shadow-build folder.
DEVASS_BUILD = $$shadowed($$PWD)
DEVASS_LIB_DIR = $$DEVASS_BUILD/lib
DEVASS_BIN_DIR = $$DEVASS_BUILD/bin
