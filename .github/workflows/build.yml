name: Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  QT_VERSION: '6.5.3'
  BUILD_TYPE: Release

jobs:
  windows-msvc:
    name: Windows MSVC 2019
    runs-on: windows-2019

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          arch: win64_msvc2019_64
          cache: true

      - name: Configure qmake
        run: qmake DevAssistantQt.pro -r CONFIG+=${{ env.BUILD_TYPE }}

      - name: Build with jom
        run: jom -j${{ matrix.jobs }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: DevAssistantQt-Windows-MSVC
          path: release/DevAssistantQt.exe
          if-no-files-found: warn

  windows-minGW:
    name: Windows MinGW 64-bit
    runs-on: windows-2019

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          arch: win64_mingw
          cache: true

      - name: Configure qmake
        run: qmake DevAssistantQt.pro -r CONFIG+=${{ env.BUILD_TYPE }}

      - name: Build with mingw32-make
        run: mingw32-make -j${{ matrix.jobs }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: DevAssistantQt-Windows-MinGW
          path: release/DevAssistantQt.exe
          if-no-files-found: warn

  linux-gcc:
    name: Linux GCC
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            xkb-data

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          arch: gcc_64
          cache: true

      - name: Configure qmake
        run: qmake DevAssistantQt.pro -r CONFIG+=${{ env.BUILD_TYPE }}

      - name: Build with make
        run: make -j$(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: DevAssistantQt-Linux-GCC
          path: release/DevAssistantQt
          if-no-files-found: warn

  macos-clang:
    name: macOS Clang
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          arch: clang_64
          cache: true

      - name: Configure qmake
        run: qmake DevAssistantQt.pro -r CONFIG+=${{ env.BUILD_TYPE }}

      - name: Build with make
        run: make -j$(sysctl -n hw.ncpu)

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: DevAssistantQt-macOS-Clang
          path: release/DevAssistantQt.app
          if-no-files-found: warn
