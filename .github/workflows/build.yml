name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows-mingw:
    name: Windows, Qt 5.15 MinGW
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch tree-sitter sources
        shell: pwsh
        run: ./scripts/fetch_tree_sitter.ps1

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_mingw81
          modules: ''
          tools: 'tools_mingw,qt.tools.win64_mingw810'
          cache: true

      - name: Put MinGW on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:IQTA_TOOLS\mingw810_64\bin"

      - name: Configure
        run: qmake DevAssistantQt.pro CONFIG+=release

      - name: Build
        run: mingw32-make -j4

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: DevAssistantQt-windows-mingw
          path: release/DevAssistantQt.exe
          if-no-files-found: error
