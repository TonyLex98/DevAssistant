name: Build

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows-mingw:
    name: Windows, Qt 5.15 MinGW
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch tree-sitter sources
        shell: pwsh
        run: ./scripts/fetch_tree_sitter.ps1

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_mingw81
          modules: ''
          tools: 'tools_mingw,qt.tools.win64_mingw810'
          cache: true

      - name: Put MinGW on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:IQTA_TOOLS\mingw810_64\bin"

      - name: Configure
        run: qmake DevAssistantQt.pro CONFIG+=release

      - name: Build
        run: mingw32-make -k -j4

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: DevAssistantQt-windows-mingw
          path: release/DevAssistantQt.exe
          if-no-files-found: error

      # The tests build and run even if the app build failed, so both kinds of breakage show up.
      # Folders with sh.exe (Git) are dropped from PATH: with sh.exe found, mingw32-make runs
      # commands through it, while qmake's MinGW makefiles are written for cmd.exe.
      - name: Build tests
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $dirs = $env:PATH -split ';' | Where-Object { $_ }
          $withSh = $dirs | Where-Object { Test-Path (Join-Path $_ 'sh.exe') }
          if ($withSh) { Write-Host "Left out of PATH: $($withSh -join '; ')" }
          $env:PATH = ($dirs | Where-Object { $withSh -notcontains $_ }) -join ';'
          Write-Host "qmake: $((Get-Command qmake).Source); make: $((Get-Command mingw32-make).Source)"
          New-Item -ItemType Directory -Force build-tests | Out-Null
          Set-Location build-tests
          qmake ../tests/tests.pro CONFIG+=release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mingw32-make -k -j4
          exit $LASTEXITCODE

      # Without a console, Qt Test on Windows writes its results to OutputDebugString;
      # QT_FORCE_STDERR_LOGGING puts them on stdout. A test that prints no totals fails.
      - name: Run tests
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = @()
          foreach ($dir in Get-ChildItem tests -Directory -Filter 'tst_*') {
            $name = $dir.Name
            $exe = Get-ChildItem build-tests -Recurse -Filter "$name.exe" | Select-Object -First 1
            if (-not $exe) {
              Write-Host "::error::$name was not built"
              $failed += $name
              continue
            }
            Write-Host "===== $name"
            $out = & $exe.FullName
            $code = $LASTEXITCODE
            $out | ForEach-Object { Write-Host $_ }
            if ($code -ne 0 -or -not ($out -match '^Totals:')) { $failed += $name }
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::Failed: $($failed -join ', ')"
            exit 1
          }
