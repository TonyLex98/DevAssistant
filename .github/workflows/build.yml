name: Build

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # publishing the release on a v* tag

jobs:
  windows-mingw:
    name: Windows, Qt 5.15 MinGW
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch tree-sitter sources
        shell: pwsh
        run: ./scripts/fetch_tree_sitter.ps1

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_mingw81
          modules: ''
          tools: 'tools_mingw,qt.tools.win64_mingw810'
          cache: true

      - name: Put MinGW on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:IQTA_TOOLS\mingw810_64\bin"

      # "python" on PATH is now the MinGW toolchain's Python 2 (for gdb); use the runner's Python 3.
      - name: Fetch OpenSSL 1.1.1 for HTTPS
        shell: pwsh
        run: |
          & "$env:pythonLocation\python.exe" -m pip install --quiet zstandard
          & "$env:pythonLocation\python.exe" scripts/fetch_openssl.py openssl

      - name: Update the Russian translation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force translations | Out-Null
          lupdate DevAssistant.pro -ts translations/devassistant_ru.ts -no-obsolete -locations none -tr-function-alias tr+=tr_fn
          & "$env:pythonLocation\python.exe" scripts/fill_translations.py translations/devassistant_ru.ts translations/ru

      # One shadow build of everything: the core library, the program and the tests.
      # Folders with sh.exe (Git) are dropped from PATH: with sh.exe found, mingw32-make runs
      # commands through it, while qmake's MinGW makefiles are written for cmd.exe.
      # -k: a broken file does not hide the errors in the others.
      - name: Build
        shell: pwsh
        run: |
          $dirs = $env:PATH -split ';' | Where-Object { $_ }
          $withSh = $dirs | Where-Object { Test-Path (Join-Path $_ 'sh.exe') }
          if ($withSh) { Write-Host "Left out of PATH: $($withSh -join '; ')" }
          $env:PATH = ($dirs | Where-Object { $withSh -notcontains $_ }) -join ';'
          New-Item -ItemType Directory -Force build | Out-Null
          Set-Location build
          qmake ../DevAssistant.pro CONFIG+=release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mingw32-make -k -j4
          exit $LASTEXITCODE

      # Without a console, Qt Test on Windows writes its results to OutputDebugString;
      # QT_FORCE_STDERR_LOGGING puts them on stdout. A test that prints no totals fails.
      - name: Run tests
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = @()
          foreach ($dir in Get-ChildItem tests -Directory -Filter 'tst_*') {
            $name = $dir.Name
            $exe = Get-ChildItem build/tests -Recurse -Filter "$name.exe" | Select-Object -First 1
            if (-not $exe) {
              Write-Host "::error::$name was not built"
              $failed += $name
              continue
            }
            Write-Host "===== $name"
            $out = & $exe.FullName
            $code = $LASTEXITCODE
            $out | ForEach-Object { Write-Host $_ }
            if ($code -ne 0 -or -not ($out -match '^Totals:')) { $failed += $name }
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::Failed: $($failed -join ', ')"
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          ./scripts/deploy_windows.ps1 -ExePath build/bin/DevAssistantQt.exe -OutDir dist/DevAssistant -OpenSslDir openssl -Zip "DevAssistant-$version-windows-x64.zip"
          "PACKAGE=DevAssistant-$version-windows-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke test and screenshots
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:\Windows\Fonts   # offscreen reads fonts with FreeType from this folder
        run: |
          # windeployqt ships only the Windows platform plugin; the headless run needs offscreen.
          Copy-Item "$env:QT_ROOT_DIR\plugins\platforms\qoffscreen.dll" dist/DevAssistant/platforms/
          # The project shown in the screenshots: this repository without build output.
          git clone --quiet "$PWD" "$env:RUNNER_TEMP/DevAssistant"
          $exe = "dist/DevAssistant/DevAssistantQt.exe"
          foreach ($lang in @("en", "ru")) {
            $p = Start-Process $exe -ArgumentList "--lang", $lang, "--screenshots", "screenshots/$lang", "--project", "$env:RUNNER_TEMP/DevAssistant", "--open", "src/core/commands/CommandPolicy.cpp" -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "The program did not finish the screenshot run in 60 s ($lang)" }
            if ($p.ExitCode -ne 0) { throw "The program exited with code $($p.ExitCode) ($lang)" }
          }
          Get-ChildItem -Recurse screenshots | ForEach-Object { "$($_.FullName) $($_.Length)" }
          if (-not (Test-Path screenshots/en/main.png)) { throw "No screenshot was written" }
          # The command reference, generated from the descriptions the model is given.
          $docs = Start-Process $exe -ArgumentList "--print-command-docs", "--markdown", "--out", "$PWD/generated/COMMANDS.md" -PassThru -Wait
          if ($docs.ExitCode -ne 0 -or -not (Test-Path generated/COMMANDS.md)) { throw "The command reference was not generated (exit code $($docs.ExitCode))" }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DevAssistant-windows-x64
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

      - name: Upload screenshots and translation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-translation
          path: |
            screenshots/
            generated/
            translations/devassistant_ru.ts

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE }}
          body_path: RELEASE_NOTES.md
